apiVersion: v1
kind: ConfigMap
metadata:
  name: ts-funnel-config
  namespace: giera
data:
  serve.json: |
    {
      "TCP": {"443": {"HTTPS": true}},
      "Web": {"${TS_CERT_DOMAIN}:443": {"Handlers": {"/": {"Proxy": "http://127.0.0.1:8080"}}}},
      "AllowFunnel": {"${TS_CERT_DOMAIN}:443": true}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ts-funnel-state
  namespace: giera
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: giera-data
  namespace: giera
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi

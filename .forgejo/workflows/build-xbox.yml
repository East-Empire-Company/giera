name: build-xbox

on:
  push:
    branches: [main]
    paths:
      - 'platform/xbox-uwp-giera/**'
      - 'src/**'
      - 'public/**'
      - '.forgejo/workflows/build-xbox.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H mac-studio-jakub.tail5d39b4.ts.net >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H desktop-fjvada8.tail5d39b4.ts.net >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync repo + node_modules to Windows desktop
        run: |
          tar czf /tmp/giera-xbox-build.tar.gz \
            --exclude='.git' --exclude='.ai' --exclude='tests' \
            --exclude='public/assets/textures/pbr' --exclude='public/assets/models' \
            --exclude='public/assets/audio' --exclude='public/videos' --exclude='public/assets/hdr' \
            --exclude='platform/xbox-uwp-giera/AppPackages' \
            --exclude='platform/xbox-uwp-giera/Assets/www' \
            --exclude='platform/xbox-uwp-giera/bin' \
            --exclude='platform/xbox-uwp-giera/obj' \
            --exclude='node_modules/*-darwin-*' \
            --exclude='node_modules/*-linux-*' \
            --exclude='node_modules/@*/*-darwin-*' \
            --exclude='node_modules/@*/*-linux-*' \
            --exclude='coverage' --exclude='dist' \
            package.json bun.lock tsconfig.json vite.config.ts vitest.config.ts \
            node_modules/ src/ public/ platform/xbox-uwp-giera/ scripts/ server/
          scp -o StrictHostKeyChecking=accept-new -J jakubsikora@mac-studio-jakub.tail5d39b4.ts.net \
            /tmp/giera-xbox-build.tar.gz jakubsikora@desktop-fjvada8.tail5d39b4.ts.net:/tmp/giera-xbox-build.tar.gz
          ssh -o StrictHostKeyChecking=accept-new -J jakubsikora@mac-studio-jakub.tail5d39b4.ts.net \
            jakubsikora@desktop-fjvada8.tail5d39b4.ts.net \
            'powershell -Command "New-Item -ItemType Directory -Path C:\Users\jakubsikora\Repos\personal\giera -Force | Out-Null; tar -xzf /tmp/giera-xbox-build.tar.gz -C C:\Users\jakubsikora\Repos\personal\giera"'

      - name: Build web app
        run: |
          ssh -o StrictHostKeyChecking=accept-new -J jakubsikora@mac-studio-jakub.tail5d39b4.ts.net \
            jakubsikora@desktop-fjvada8.tail5d39b4.ts.net \
            'powershell -Command "Set-Location C:\Users\jakubsikora\Repos\personal\giera; C:\Users\jakubsikora\.bun\bin\bun.exe run build; C:\Users\jakubsikora\.bun\bin\bun.exe platform/xbox-uwp-giera/sync-web.ts --skip-build"'

      - name: Build Xbox MSIX
        run: |
          ssh -o StrictHostKeyChecking=accept-new -J jakubsikora@mac-studio-jakub.tail5d39b4.ts.net \
            jakubsikora@desktop-fjvada8.tail5d39b4.ts.net \
            'powershell -ExecutionPolicy Bypass -Command "Set-Location C:\Users\jakubsikora\Repos\personal\giera\platform\xbox-uwp-giera; .\build-giera.ps1"'

      - name: Fetch MSIX artifacts
        run: |
          mkdir -p artifacts
          scp -o StrictHostKeyChecking=accept-new -J jakubsikora@mac-studio-jakub.tail5d39b4.ts.net -r \
            'jakubsikora@desktop-fjvada8.tail5d39b4.ts.net:C:/Users/jakubsikora/Repos/personal/giera/platform/xbox-uwp-giera/AppPackages/*/Giera.Uwp_*.msix' \
            artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - uses: actions/upload-artifact@v3
        with:
          name: giera-msix
          path: artifacts/*.msix
          if-no-files-found: warn
          retention-days: 14

name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to homelab via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H mac-studio-jakub.tail5d39b4.ts.net >> ~/.ssh/known_hosts 2>/dev/null

          ssh -o StrictHostKeyChecking=accept-new jakub@mac-studio-jakub.tail5d39b4.ts.net \
            'cd ~/Repos/personal/giera && git pull origin main && bun run deploy'

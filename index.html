<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183b35" />
    <title>Giera</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/ui/kenney/star.png" />
  </head>
  <body>
    <main id="app" aria-label="Giera">
      <canvas id="game" aria-label="Voxelowy świat Giera"></canvas>
      <section id="boot-status" class="boot-status" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">G</div>
          <div class="boot-copy">
            <h1>Giera</h1>
            <p id="boot-message">Przygotowujemy świat do wspólnej zabawy.</p>
            <div class="boot-track" aria-hidden="true"><span id="boot-progress"></span></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</html>
